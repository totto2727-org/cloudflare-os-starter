packages:
  - cloudflare-os/packages/workshop-shared
  - cloudflare-os/packages/error-reporting
  - packages/*

# Compatible ranges for cloudflare-os/pnpm-workspace.yaml's shared catalog. Required, not merely tidy: the two
# submodule packages above are members of THIS workspace, and both declare `catalog:` specifiers
# that resolve here rather than in the submodule -- without these entries `pnpm install` fails
# outright.
#
# Keep shared resolved versions aligned with the submodule when updating either lockfile. Drift is
# silent: the starter and the submodule install separately, so a different capnweb range gives the
# tree two copies, and a stub minted by one is unserialisable by the other's session
# (`TypeError: Cannot serialize value: [object RpcStub]`). A deduped dev machine hides it; the
# split installs in CI and on a fresh checkout do not. See
# cloudflare-os/docs/integration-testing.md.
catalog:
  '@cloudflare/vitest-pool-workers': ^0.20.2
  capnweb: ^0.11.1
  # Compatible 0.2.x releases satisfy the shared capnweb >=0.7.0 peer requirement.
  capnweb-validate: ^0.2.4
  # TypeScript 7 (tsgo). The submodule's tsconfig sets `singleThreaded`, which TS 5.9
  # rejects outright, so every package extending it has to be on 7.x. Nothing here uses the JS
  # compiler API, so the submodule's `typescript6` alias is not needed.
  typescript: ^7.0.2
  # Stay on Vite 7: the transform has to stay on esbuild. Oxc does not lower the Stage-3
  # decorators capnweb-validate's `@validateRpc()` relies on (cloudflare/workers-sdk#12626).
  vite: ^7.3.6
  vite-plus: ^0.2.8
  vitest: ^4.1.10
  wrangler: ^4.119.0

overrides:
  # Vitest peers can resolve vite@latest, so constrain them to the compatible Vite 7 range. Points at the
  # catalog so this and the manifests can't disagree: a catalog only covers what a workspace
  # manifest declares itself, and the override is what reaches vite as somebody else's peer.
  vite: "catalog:"
  # Constrain optional vite/vitest peers to the compatible Node 26 type range.
  '@types/node': ^26.1.0

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
